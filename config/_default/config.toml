baseURL = "https://kai2055.github.io/"
languageCode = "en-us"
defaultContentLanguage = "en"
title = "Nikhil Adhikari"
theme = "stack"

[languages.en]
languageName = "English"
languageCode = "en-US"
weight = 1

# Change to "Etc/UTC" or your zone; affects post dates
timeZone = "Europe/Berlin"

# Pagination (posts per page on the homepage)
[pagination]
pagerSize = 5

[params]
mainSections = ["post"]
description = "ML systems that don't just work — they stay working. MLOps & ML reliability portfolio and notes."

  [params.dateFormat]
  published = "Jan 02, 2006"
  lastUpdated = "Jan 02, 2006"

  [params.sidebar]
  emoji = "🚀"
  subtitle = "I build ML systems that don't just work — they stay working. MLOps · ML reliability · Berlin."
  compact = false
  avatar = "img/avatar.jpg"

  [params.article]
  math = false
  toc = true
  readingTime = true
    [params.article.license]
    enabled = true
    default = "Licensed under CC BY-NC-SA 4.0"

  [params.colorScheme]
  # Let visitors switch; default follows their system
  toggle = true
  default = "auto"

  [params.imageProcessing]
    [params.imageProcessing.cover]
    enabled = true
    [params.imageProcessing.content]
    enabled = true

  [params.footer]
  since = 2026
  customText = ""

  # Homepage sidebar + right-hand widgets
  [params.widgets]
    [[params.widgets.homepage]]
    type = "search"
    [[params.widgets.homepage]]
    type = "archives"
      [params.widgets.homepage.params]
      limit = 5
    [[params.widgets.homepage]]
    type = "categories"
      [params.widgets.homepage.params]
      limit = 10
    [[params.widgets.homepage]]
    type = "tag-cloud"
      [params.widgets.homepage.params]
      limit = 10

    [[params.widgets.page]]
    type = "toc"

[permalinks]
post = "/p/:slug/"
page = "/:slug/"

# Search index JSON is declared on the /search/ page's own frontmatter
[outputs]
home = ["HTML", "RSS"]
